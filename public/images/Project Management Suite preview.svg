    <text x="16" y="358" fill="#94A3B8" font-family="monospace" font-size="11">Technicians update work orders offline via mobile app. Live cloud sync on reconnect.</text>
    <rect x="16" y="375" width="220" height="24" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="26" y="391" fill="#10B981" font-family="monospace" font-size="10">● GPS Verification Active</text>
